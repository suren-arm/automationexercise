# ---------------------------------------------------------------------------
# Test data for the four automated Automation Exercise scenarios.
#
# These are business values, not framework settings, so they are kept separate
# from config.properties. Uniquely generated per-run data (such as the
# registration email address) is NOT stored here - it is built at runtime by
# the Account model so that tests stay repeatable.
# ---------------------------------------------------------------------------

# Test Case 9 - the term typed into the product search box.
search.product=Blue Top

# Test Case 25 - text that must be visible again after scrolling back up.
home.hero.text=Full-Fledged practice website for Automation Engineers

# Test Case 16 - comment entered on the checkout page.
checkout.comment=Please deliver the order carefully.

# Test Case 16 - payment values. This is a well-known dummy card number that
# the public practice site accepts; it is not a real payment instrument.
payment.card.number=4111111111111111
payment.cvc=123
payment.expiry.month=12
payment.expiry.year=2030
