# Browser configuration.
browser=chrome
headless=false
timeout=20

# Selected environment.
environment=qa

# IMPORTANT:
# The assignment URL is used as base_url exactly as requested.
base_url=https://automationexercise.com

# Kept environment-specific so CI can later point stage/prod elsewhere.
qa.base_url=https://automationexercise.com
stage.base_url=https://automationexercise.com
prod.base_url=https://automationexercise.com

# Test Case 9 data.
search.product=Blue Top

# Test Case 16 checkout data.
checkout.comment=Please deliver the order carefully.

# Test Case 16 payment data used only by the public practice site.
payment.card.number=4111111111111111
payment.cvc=123
payment.expiry.month=12
payment.expiry.year=2030

# Test Case 25 expected text.
home.hero.text=Full-Fledged practice website for Automation Engineers

# Number of TestNG parallel worker threads. Override with -Dthread.count=X
thread.count=2

# Execution mode shown in suite lifecycle logs.
# Supported descriptive values: local, remote
# Change to remote when executing against Selenium Grid/cloud infrastructure.
execution.mode=local
