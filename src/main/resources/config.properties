# ---------------------------------------------------------------------------
# Framework configuration.
#
# Only values that control HOW the framework runs belong here.
# Business/test values live in testdata.properties.
#
# Every key may be overridden from the command line, for example:
#   mvn clean test -Dbrowser=firefox -Dheadless=true
# ---------------------------------------------------------------------------

# Browser under test: chrome, firefox (gecko) or edge.
browser=chrome

# Run the browser without a visible window.
#
# true by default so that one setting is correct everywhere: a CI agent has no
# display and cannot run a visible browser, so any other default would force CI
# to override this file and stop matching local runs. To watch the browser
# during a run, pass -Dheadless=false for that run only.
headless=true

# Number of TestNG worker threads. The suite runs test classes in parallel
# (parallel="classes" in testng.xml); this decides how many run at once.
# 1 runs everything sequentially.
thread.count=2

# Explicit-wait timeout in seconds used by every wait in the framework.
# 30s rather than 20s because this public practice site is ad-heavy and its
# response time varies a lot; waits return as soon as their condition is met,
# so a higher ceiling costs nothing on a fast run.
explicit.wait.seconds=30

# Application under test.
base.url=https://automationexercise.com

# Logging verbosity: TRACE, DEBUG, INFO, WARN or ERROR.
# Applied at startup; an unrecognised value falls back to INFO.
LOG_LEVEL=INFO
